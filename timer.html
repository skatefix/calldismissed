<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - 24.12.2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2a2a2a;
        }

        .container {
            text-align: center;
            padding: 0;
            max-width: 800px;
            width: 90%;
        }

        .timer-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            align-items: center;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .time-unit-value {
            font-size: 4em;
            font-weight: bold;
            color: white;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }

        .time-unit-label {
            font-size: 0.75em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            font-weight: 500;
        }

        .separator {
            width: 2px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 -15px;
        }

        .finished {
            display: none;
            font-size: 2.5em;
            color: #fff;
            font-weight: bold;
            padding: 40px;
            margin-top: 20px;
        }

        .finished.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-display">
            <div class="time-unit">
                <span class="time-unit-value" id="days">00</span>
                <span class="time-unit-label">Days</span>
            </div>
            <div class="separator"></div>
            <div class="time-unit">
                <span class="time-unit-value" id="hours">00</span>
                <span class="time-unit-label">Hours</span>
            </div>
            <div class="separator"></div>
            <div class="time-unit">
                <span class="time-unit-value" id="minutes">00</span>
                <span class="time-unit-label">Minutes</span>
            </div>
            <div class="separator"></div>
            <div class="time-unit">
                <span class="time-unit-value" id="seconds">00</span>
                <span class="time-unit-label">Seconds</span>
            </div>
        </div>

        <div class="finished" id="finished">🎉 Time's Up! 🎉</div>
    </div>

    <script>
        function updateTimer() {
            // Target date: December 24, 2026 at 00:00:00
            const targetDate = new Date('2026-12-24T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                // Timer finished
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('finished').classList.add('show');
                clearInterval(timerInterval);
                return;
            }

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update timer immediately and then every second
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
