<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - 1 września 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap');

        body {
            font-family: 'Chicago', 'Monaco', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #c0c0c0 25%, transparent 25%, transparent 75%, #c0c0c0 75%, #c0c0c0),
                        linear-gradient(45deg, #c0c0c0 25%, transparent 25%, transparent 75%, #c0c0c0 75%, #c0c0c0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-color: #dfdfdf;
            padding: 20px;
        }

        .container {
            background: #c0c0c0;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            border-radius: 6px;
            box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.5), inset -2px -2px 0 rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
            background-image: linear-gradient(to bottom, #dfdfdf 0%, #c0c0c0 100%);
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d7);
            color: white;
            padding: 2px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px 3px 0 0;
            font-family: 'Chicago', monospace;
            letter-spacing: 0.5px;
        }

        .title-buttons {
            display: flex;
            gap: 2px;
        }

        .mac-button {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.3);
            cursor: pointer;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 0, 0, 0.5);
        }

        .mac-button.close {
            background: #ff5f56;
        }

        .mac-button.minimize {
            background: #ffbd2e;
        }

        .mac-button.maximize {
            background: #27c93f;
        }

        .mac-menu-bar {
            display: flex;
            background: #c0c0c0;
            border-bottom: 1px solid #808080;
            padding: 2px 5px;
            gap: 15px;
            font-size: 12px;
            font-family: 'Chicago', monospace;
        }

        .mac-menu-item {
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            user-select: none;
        }

        .mac-menu-item:hover {
            background: #000080;
            color: white;
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-unit-value {
            font-size: 3.5em;
            font-weight: 300;
            color: white;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
            line-height: 1;
        }

        .time-unit-label {
            font-size: 0.65em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            font-weight: 300;
        }

        .separator {
            font-size: 3em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-bottom: 15px;
        }

        .finished {
            display: none;
            font-size: 2.5em;
            color: #fff;
            font-weight: 300;
            padding: 40px;
            margin-top: 20px;
        }

        .finished.show {
            display: block;
        }

        .minecraft-block {
            margin-top: 0;
        }

        .block-link {
            display: inline-block;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .block-link:hover {
            transform: rotateX(10deg) rotateY(10deg) scale(1.05);
        }

        .block-link:active {
            transform: rotateX(10deg) rotateY(10deg) scale(0.95);
        }

        /* Image version of the block */
        .block-img {
            width: 100px;
            height: 100px;
            display: block;
            object-fit: contain;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-bar">
            <span>Countdown Timer</span>
            <div class="title-buttons">
                <div class="mac-button close"></div>
                <div class="mac-button minimize"></div>
                <div class="mac-button maximize"></div>
            </div>
        </div>

        <div class="mac-menu-bar">
            <div class="mac-menu-item">File</div>
            <div class="mac-menu-item">Edit</div>
            <div class="mac-menu-item">View</div>
        </div>

        <div class="content">
            <div class="timer-display">
                <div class="time-unit">
                    <span class="time-unit-value" id="days">00</span>
                    <span class="time-unit-label">Days</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-unit-value" id="hours">00</span>
                    <span class="time-unit-label">Hours</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-unit-value" id="minutes">00</span>
                    <span class="time-unit-label">Minutes</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-unit-value" id="seconds">00</span>
                    <span class="time-unit-label">Seconds</span>
                </div>
            </div>

            <div class="minecraft-block">
                <a href="https://classic.minecraft.net/" class="block-link">
                    <!-- Replaced the previous 3D CSS block with the provided PNG image named block.png -->
                    <img src="block.png" alt="Block" class="block-img">
                </a>
            </div>

            <div class="finished" id="finished">🎉 Time's Up! 🎉</div>
        </div>
    </div>

    <script>
        function updateTimer() {
            // Target date: September 1, 2026 at 00:00:00
            const targetDate = new Date('2026-09-01T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                // Timer finished
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('finished').classList.add('show');
                clearInterval(timerInterval);
                return;
            }

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update timer immediately and then every second
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
