<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - 1 września 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap');

        body {
            font-family: 'Space Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #171616;
            font-weight: 300;
        }

        .container {
            text-align: center;
            padding: 0;
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-unit-value {
            font-size: 3.5em;
            font-weight: 300;
            color: white;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
            line-height: 1;
        }

        .time-unit-label {
            font-size: 0.65em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            font-weight: 300;
        }

        .separator {
            font-size: 3em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-bottom: 15px;
        }

        .finished {
            display: none;
            font-size: 2.5em;
            color: #fff;
            font-weight: 300;
            padding: 40px;
            margin-top: 20px;
        }

        .finished.show {
            display: block;
        }

        .minecraft-block {
            margin-top: 40px;
            perspective: 1000px;
        }

        .block-link {
            display: inline-block;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .block-link:hover {
            transform: rotateX(10deg) rotateY(10deg) scale(1.05);
        }

        .block-link:active {
            transform: rotateX(10deg) rotateY(10deg) scale(0.95);
        }

        .block-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 6s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .block-face {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        .block-top {
            background-color: #4CAF50;
            transform: rotateX(90deg) translateZ(50px);
        }

        .block-bottom {
            background-color: #2E7D32;
            transform: rotateX(-90deg) translateZ(50px);
        }

        .block-front {
            background-color: #388E3C;
            transform: translateZ(50px);
        }

        .block-back {
            background-color: #2E7D32;
            transform: rotateY(180deg) translateZ(50px);
        }

        .block-right {
            background-color: #43A047;
            transform: rotateY(90deg) translateZ(50px);
        }

        .block-left {
            background-color: #2E7D32;
            transform: rotateY(-90deg) translateZ(50px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-display">
            <div class="time-unit">
                <span class="time-unit-value" id="days">00</span>
                <span class="time-unit-label">Days</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span class="time-unit-value" id="hours">00</span>
                <span class="time-unit-label">Hours</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span class="time-unit-value" id="minutes">00</span>
                <span class="time-unit-label">Minutes</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span class="time-unit-value" id="seconds">00</span>
                <span class="time-unit-label">Seconds</span>
            </div>
        </div>

        <div class="minecraft-block">
            <a href="https://classic.minecraft.net/" class="block-link">
                <div class="block-3d">
                    <div class="block-face block-top"></div>
                    <div class="block-face block-bottom"></div>
                    <div class="block-face block-front"></div>
                    <div class="block-face block-back"></div>
                    <div class="block-face block-right"></div>
                    <div class="block-face block-left"></div>
                </div>
            </a>
        </div>

        <div class="finished" id="finished">🎉 Time's Up! 🎉</div>
    </div>

    <script>
        function updateTimer() {
            // Target date: September 1, 2026 at 00:00:00
            const targetDate = new Date('2026-09-01T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                // Timer finished
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('finished').classList.add('show');
                clearInterval(timerInterval);
                return;
            }

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update timer immediately and then every second
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
