<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - 24.12.2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .timer-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-unit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .time-unit-value {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .time-unit-label {
            font-size: 0.9em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .message {
            font-size: 1.2em;
            color: #666;
            margin-top: 20px;
            font-weight: 500;
        }

        .finished {
            display: none;
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .finished.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Countdown to 24.12.2026</h1>
        
        <div class="timer-display">
            <div class="time-unit">
                <span class="time-unit-value" id="days">0</span>
                <span class="time-unit-label">Days</span>
            </div>
            <div class="time-unit">
                <span class="time-unit-value" id="hours">0</span>
                <span class="time-unit-label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="time-unit-value" id="minutes">0</span>
                <span class="time-unit-label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="time-unit-value" id="seconds">0</span>
                <span class="time-unit-label">Seconds</span>
            </div>
        </div>

        <div class="message" id="message">Get ready!</div>
        <div class="finished" id="finished">🎉 Time's Up! 🎉</div>
    </div>

    <script>
        function updateTimer() {
            // Target date: December 24, 2026 at 00:00:00
            const targetDate = new Date('2026-12-24T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                // Timer finished
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                document.getElementById('message').style.display = 'none';
                document.getElementById('finished').classList.add('show');
                clearInterval(timerInterval);
                return;
            }

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update timer immediately and then every second
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
